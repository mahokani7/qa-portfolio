# =============================================================================
# AI Agent 품질관리·운영 모니터링 플랫폼 — 통합 실행 (10단계: Docker 통합 실행)
#
# 실행:   docker compose up -d --build
# 종료:   docker compose down
#
# 서비스 구성
#   app        : FastAPI 서버 (/health, /ask, /metrics)      → http://localhost:8000
#   prometheus : app의 /metrics를 주기적으로 수집             → http://localhost:9090
#   grafana    : Prometheus 데이터를 실시간 대시보드로 시각화   → http://localhost:3000 (admin/admin)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FastAPI 서비스 (Service Agent + Judge Agent + Rule Validator)
  # ---------------------------------------------------------------------------
  app:
    build: .
    container_name: ai_agent_quality_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data                        # RAG 지식 파일 + ChromaDB
      - ./quality/reports:/app/quality/reports   # 품질평가 리포트 산출물
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - ai_quality_net

  # ---------------------------------------------------------------------------
  # Prometheus — /metrics 스크레이핑 및 지표 저장 (7단계)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: ai_agent_quality_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # k6 성능 테스트 결과를 remote-write로 받기 위해 수신 기능을 활성화한다 (k6 -o experimental-prometheus-rw)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
    depends_on:
      - app
    networks:
      - ai_quality_net

  # ---------------------------------------------------------------------------
  # Grafana — Prometheus 데이터소스 기반 실시간 운영 대시보드 (8단계)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: ai_agent_quality_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Streamlit 등 외부 페이지에 대시보드를 iframe으로 임베딩하기 위한 설정
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_COOKIE_SAMESITE=none
      # 보고서 부록에 실제 Grafana 패널을 PNG로 캡처하기 위한 이미지 렌더러 연동 (아래 renderer 서비스)
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      # 최신 Grafana는 기본 렌더러 토큰을 거부한다 → 렌더러와 동일한 토큰을 지정(AUTH_TOKEN과 일치)
      - GF_RENDERING_RENDERER_TOKEN=aiquality-render-token
      - GF_LOG_FILTERS=rendering:info
    volumes:
      - grafana_data:/var/lib/grafana
      # 데이터소스(Prometheus)·대시보드 자동 프로비저닝 (수동 설정 불필요)
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - renderer
    networks:
      - ai_quality_net

  # ---------------------------------------------------------------------------
  # Grafana Image Renderer — 대시보드 패널을 서버에서 PNG로 렌더링 (보고서 부록 캡처용)
  #   Grafana의 /render/d-solo/... 요청을 이 서비스가 처리한다.
  # ---------------------------------------------------------------------------
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: ai_agent_quality_renderer
    restart: unless-stopped
    environment:
      - ENABLE_METRICS=false
      # Grafana(GF_RENDERING_RENDERER_TOKEN)와 반드시 동일해야 렌더 요청이 인증된다
      - AUTH_TOKEN=aiquality-render-token
    networks:
      - ai_quality_net

networks:
  ai_quality_net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
