# Grafana 대시보드 자동 프로비저닝
# /var/lib/grafana/dashboards 폴더의 JSON 대시보드를 기동 시 자동으로 불러옵니다.
apiVersion: 1

providers:
  - name: "AI Quality Dashboards"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
