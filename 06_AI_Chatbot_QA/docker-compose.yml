services:
  api:
    build:
      context: .
    container_name: ai-quality-api
    env_file:
      - .env
    command: python -m uvicorn api_app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: .
    container_name: ai-quality-dashboard
    env_file:
      - .env
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://localhost:3000
      GRAFANA_DASHBOARD_URL: http://localhost:3000
      K6_SUMMARY_FILE: reports/k6_summary.json
    command: streamlit run dashboard/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      api:
        condition: service_healthy
      prometheus:
        condition: service_started
      grafana:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: ai-quality-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=:9090"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ai-quality-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  prometheus-data:
  grafana-data:
